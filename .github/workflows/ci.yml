name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # manual run = secret scan over the whole history

permissions:
  contents: write   # lets the failure step post the error summary as a commit comment

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report secret scan findings
        if: steps.gitleaks.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Secret scan failed on $GITHUB_SHA"
            echo
            echo '```'
            if [ -f results.sarif ]; then
              jq -r '.runs[].results[] | "\(.ruleId)  \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)  \(.message.text)"' results.sarif | head -40
            else
              echo "(no results.sarif — the scan failed before producing a report)"
            fi
            echo '```'
          } > gitleaks-comment.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@gitleaks-comment.md >/dev/null
          exit 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Test
        id: test
        run: |
          set -o pipefail
          ./gradlew test --no-daemon --console=plain 2>&1 | tee build.log
      - name: Post failure summary as a commit comment
        if: failure() && steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### CI failed: \`gradlew test\` on $GITHUB_SHA"
            echo
            echo '```'
            grep -nE -A3 "error:" build.log | head -200
            echo '-----'
            grep -nE -A25 "^[A-Za-z0-9_.]+ > .* FAILED" build.log | head -300
            echo '-----'
            grep -nE -A2 "Caused by:" build.log | grep -vE "^\S+-\s+at " | head -60
            echo '-----'
            grep -nE "tests completed|BUILD|What went wrong|> Task .* FAILED" build.log | head -40
            echo '```'
          } > comment.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@comment.md >/dev/null
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  judge-path:
    # The README's five-minute path, exactly as a judge runs it: clean checkout, no keys, TAPE_MODE=replay.
    # What both phones received and every model call are attached as the "judge-path" artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install ffmpeg and jq
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg jq
      - name: Run the judge path
        id: judge
        run: eval/judge-path/smoke.sh
      - name: Upload what the judge sees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-path
          path: build/judge-path
          if-no-files-found: ignore
      - name: Post failure as a commit comment
        if: failure() && steps.judge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### CI failed: judge path on $GITHUB_SHA"
            echo
            echo '```'
            tail -80 build/judge-path/app.log 2>/dev/null | grep -vE "^\s+at " | tail -60 || echo "(no app log)"
            echo '```'
          } > judge-comment.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@judge-comment.md >/dev/null

name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # lets the failure step post the error summary as a commit comment

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Test
        run: |
          set -o pipefail
          ./gradlew test --no-daemon --console=plain 2>&1 | tee build.log
      - name: Post failure summary as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### CI failed: \`gradlew test\` on $GITHUB_SHA"
            echo
            echo '```'
            grep -nE -A3 "error:" build.log | head -200
            echo '-----'
            grep -nE -A25 "^[A-Za-z0-9_.]+ > .* FAILED" build.log | head -300
            echo '-----'
            grep -nE "tests completed|BUILD|What went wrong|> Task .* FAILED|Caused by" build.log | head -40
            echo '```'
          } > comment.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@comment.md >/dev/null
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

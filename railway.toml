# Railway: deploy from the GitHub repo; the Dockerfile builds the jar (ffmpeg included).
# Add a PostgreSQL service and reference its DATABASE_URL on this service — the app converts the
# postgresql:// URL to JDBC itself. Then Settings → Networking → Generate Domain, and point the Meta
# webhook at https://<domain>/webhook/whatsapp.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/actuator/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

spring:
  application:
    name: concourse
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:concourse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none   # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  codec:
    max-in-memory-size: 32MB

server:
  port: ${PORT:8080}

concourse:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  admin-token: ${ADMIN_TOKEN:change-me}
  phone-hash-salt: ${PHONE_HASH_SALT:change-me}
  whatsapp:
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:verify-me}
    app-secret: ${WHATSAPP_APP_SECRET:}
    graph-base-url: ${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com/v25.0}
  meta:
    api-key: ${MODEL_API_KEY:}
    base-url: ${META_API_BASE_URL:https://api.meta.ai/v1}
    spark-model: ${SPARK_MODEL:muse-spark-1.3}
    stt-model: ${STT_MODEL:muse-voice-transcribe-1.0}
    stream: ${SPARK_STREAM:true}
    timeout-seconds: ${META_TIMEOUT_SECONDS:120}
  tts:
    base-url: ${TTS_BASE_URL:}
    token: ${TTS_TOKEN:}
    cache-dir: ${TTS_CACHE_DIR:data/tts-cache}
  audio:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  itinerary:
    allow-past-dates: ${ITINERARY_ALLOW_PAST_DATES:false}
    max-days-ahead: ${ITINERARY_MAX_DAYS_AHEAD:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
